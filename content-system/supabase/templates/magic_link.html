<div style="font-family: Arial, Helvetica, sans-serif; color: #251D16; max-width: 480px; margin: 0 auto; padding: 24px;">
  <h2 style="font-weight: normal; margin: 0 0 16px;">Sign in to Vo Creative Co.</h2>
  <p style="line-height: 1.5; margin: 0 0 24px;">Tap the button to sign in. The link works once and expires in an hour.</p>
  <p style="margin: 0 0 24px;">
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email"
       style="display: inline-block; background: #A77B3E; color: #FAF5EC; text-decoration: none; padding: 14px 22px; border-radius: 8px;">Sign in</a>
  </p>
  <p style="line-height: 1.5; color: #70604D; font-size: 14px; margin: 0;">If you did not ask for this, you can ignore this email.</p>
</div>
