[build]
  publish = "."
  # This site publishes the repo root as-is. content-system/ is the source of
  # a separate app (deployed on its own), so drop it from the published copy
  # rather than serve its source files from the marketing site.
  command = "rm -rf content-system"

[[redirects]]
  from = "http://vocreativeco.netlify.app/*"
  to = "https://vocreativeco.netlify.app/:splat"
  status = 301
  force = true

# studio.vocreativeco.com is a short link to the waitlist (keeps any #join).
# Needs studio.vocreativeco.com added as a domain alias on this site.
[[redirects]]
  from = "https://studio.vocreativeco.com/*"
  to = "https://vocreativeco.com/studio/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://studio.vocreativeco.com/*"
  to = "https://vocreativeco.com/studio/:splat"
  status = 301
  force = true

# Retired pages (site refocused on film for businesses)
[[redirects]]
  from = "/influencer.html"
  to = "/services.html"
  status = 301

[[redirects]]
  from = "/vacations.html"
  to = "/services.html"
